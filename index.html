<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>플래시몹 연습실</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Black+Han+Sans&display=swap">
<style>
  :root {
    --bg: #f3f1f8; --panel: #ffffff; --fg: #1d1a2b; --muted: #6a6480;
    --accent: #6b3fd6; --c2: #ff8a3d; --line: #dcd6ea;
    --display: "Black Han Sans", "Malgun Gothic", sans-serif;
    --body: "Gowun Dodum", "Malgun Gothic", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #15121f; --panel: #211c30; --fg: #f1eefa; --muted: #a59fbd;
            --accent: #a17dff; --c2: #ffa25f; --line: #3a3350; color-scheme: dark; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; color: var(--fg); font-family: var(--body); font-size: 16px;
         background: radial-gradient(circle at 15% 20%, #ffe3f0 0, transparent 35%),
                     radial-gradient(circle at 85% 30%, #e3f1ff 0, transparent 35%),
                     radial-gradient(circle at 50% 100%, #fff3c9 0, transparent 40%), var(--bg); }
  @media (prefers-color-scheme: dark) {
    body { background: radial-gradient(circle at 15% 20%, #3a2140 0, transparent 35%),
                       radial-gradient(circle at 85% 30%, #1f2c45 0, transparent 35%), var(--bg); }
  }
  .wrap { max-width: 720px; margin: 0 auto; padding: 40px 16px; display: grid; gap: 20px; }
  h1 { font-family: var(--display); font-weight: 400; font-size: clamp(30px, 6vw, 44px); margin: 0; }
  h1 span { color: var(--accent); }
  .sub { color: var(--muted); margin: 6px 0 0; }
  .list { display: grid; gap: 14px; }
  a.card { display: grid; gap: 6px; padding: 20px 22px; border-radius: 16px; background: var(--panel);
           border: 2px solid var(--line); color: inherit; text-decoration: none; transition: border-color .15s, transform .15s; }
  a.card:hover, a.card:focus-visible { border-color: var(--sc); transform: translateY(-2px); outline: none; }
  a.card b { font-family: var(--display); font-weight: 400; font-size: 26px; color: var(--sc); }
  a.card span { color: var(--muted); }
  .note { color: var(--muted); font-size: 14px; margin: 0; }
  @media (prefers-reduced-motion: reduce) { a.card { transition: none; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>플래시몹 <span>연습실</span></h1>
    <p class="sub">연습할 영상을 골라 주세요. 휴대폰에서도 열려요.</p>
  </header>
  <div class="list">
    <a class="card" href="dreamhigh.html" style="--sc:var(--accent)">
      <b>드림하이</b>
      <span>1부 거울모드 안무 → 2부 플래시몹, 이어서 재생</span>
    </a>
    <a class="card" href="formation.html" style="--sc:#d1356b">
      <b>드림하이 대형표</b>
      <span>21명 자리 · 언제 들어가고 어디에 서는지 · 내 번호로 찾기</span>
    </a>
    <a class="card" href="flash3.html" style="--sc:var(--c2)">
      <b>3곡 연습</b>
      <span>하얀그리움 → 꿈빛파티시엘 → 캐치캐치 · 속도 조절 · 거울 모드</span>
    </a>
  </div>
  <p class="note">인터넷이 연결되어 있어야 영상이 나와요.</p>
</div>
</body>
</html>
